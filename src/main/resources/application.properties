# Configuración básica de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=

# Configuración de HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del token JWT (ya no se necesita jwt.secret)
jwt.expiration=3600000  # Tiempo de expiración del token en milisegundos (1 hora)
jwt.audience=api        # Audiencia del token (opcional, si lo usas en otras partes)
jwt.issuer=ecommerceapi # Emisor del token (opcional, si lo usas en otras partes)
jwt.header=Authorization # Encabezado HTTP para el token
jwt.prefix=Bearer        # Prefijo del token en el encabezado